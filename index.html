<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scuba Diving</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="scoreboard" aria-live="polite" hidden>SCORE <span id="score">0</span></div>

    <section class="s0 parallax">
        <p>Scuba Diving...</p>
    </section>

    <section class="s1 parallax">
        <p>Find the biggest fish!</p>
    </section>

    <section class="s2 parallax">
      <div id="failure" hidden>
        <p>You failed!</p>
        <button id="restart" type="button">Restart</button>
      </div>
      <p id="success" hidden>Click the diver to start, then scroll down to find the fish!</p>
    </section>

    <div class="overlay" id="popup" hidden>
      <section class="box" role="alertdialog" aria-modal="true" aria-labelledby="question">
        <p id="question">Are you ready to start?</p>
        <div class="actions">
          <button id="yes" type="button">Yes</button>
          <button id="no" type="button">No</button>
        </div>
      </section>
    </div>

    <div class="overlay" id="complete" hidden>
      <section class="box" role="alertdialog" aria-modal="true" aria-labelledby="complete-title">
        <p id="complete-title">Dive complete!</p>
        <p>You caught <span id="caught-count">0</span> fish!</p>
        <button id="restart-complete" type="button">Restart</button>
      </section>
    </div>

    <div id="really-large-div" hidden>
      <!-- empty -->
    </div>

    <div id="box-scroll-values" class="fixed-box" hidden>
      <p>DIVE DEPTH</p>
      <p><span id="depth">0</span> m</p>
    </div>

    <div id="box-center" class="fixed-box" hidden>
      <p id="content-center"></p>
    </div>

    <div hidden>
      <p>event.clientX: <span id="client-x">0</span> px</p>
      <p>event.clientY: <span id="client-y">0</span> px</p>
    </div>

    <div id="goby-zone" class="goby-zone" hidden>
      <img id="goby" src="images/goby.png" alt="Goby fish" hidden />
    </div>
    <div class="fish-zone fish-clownfish" hidden>
      <img src="images/clownfish.png" alt="Clownfish" hidden />
    </div>
    <div class="fish-zone fish-angelfish" hidden>
      <img src="images/angelfish.png" alt="Angelfish" hidden />
    </div>
    <div class="fish-zone fish-pufferfish" hidden>
      <img src="images/pufferfish.png" alt="Pufferfish" hidden />
    </div>
    <div class="fish-zone fish-anglerfish" hidden>
      <img src="images/anglerfish.png" alt="Anglerfish" hidden />
    </div>
    <div class="fish-zone fish-butterflyfish" hidden>
      <img src="images/butterflyfish.png" alt="Butterflyfish" hidden />
    </div>
    <div class="fish-zone fish-tuna" hidden>
      <img src="images/tuna.png" alt="Tuna" hidden />
    </div>
    <div class="fish-zone fish-oarfish" hidden>
      <img src="images/oarfish.png" alt="Oarfish" hidden />
    </div>
    <div class="fish-zone fish-cardinalfish" hidden>
      <img src="images/cardinalfish.png" alt="Cardinalfish" hidden />
    </div>
    <div class="fish-zone fish-hatchetfish" hidden>
      <img src="images/hatchetfish.png" alt="Hatchetfish" hidden />
    </div>
    <div class="fish-zone fish-lanternfish" hidden>
      <img src="images/lanternfish.png" alt="Lanternfish" hidden />
    </div>
    <div class="fish-zone fish-wrasse" hidden>
      <img src="images/wrasse.png" alt="Wrasse" hidden />
    </div>
    
</body>
</html>
