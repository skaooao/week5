<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scuba Diving</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <section class="s0 parallax">
        <p>Scuba Diving...</p>
    </section>

    <section class="s1 parallax">
        <p>Find the biggest fish!</p>
    </section>

    <section class="s2 parallax">
      <p id="failure" hidden>You failed!</p>
      <p id="success" hidden>Click yourself to go diving.</p>
    </section>

    <div class="overlay" id="popup" hidden>
      <section class="box" role="alertdialog" aria-modal="true" aria-labelledby="question">
        <p id="question">Are you ready to start?</p>
        <div class="actions">
          <button id="yes" type="button">Yes</button>
          <button id="no" type="button">No</button>
        </div>
      </section>
      
      
    </div>
    
</body>
</html>
